<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marwan Albasha | منصة تعليمية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6fb;color:#172033}button,input,select{font:inherit}.wrap{min-height:100vh;display:grid;place-items:center;padding:25px}.box{width:min(980px,100%);background:white;border:1px solid #e5e9f2;border-radius:28px;box-shadow:0 25px 70px #17204a12;overflow:hidden}.head{padding:30px;background:linear-gradient(120deg,#11162a,#5b5ce2);color:#fff}.head h1{margin:0 0 6px;font-size:28px}.head p{margin:0;color:#d7d9e8;font-size:13px}.tabs{display:flex;gap:8px;padding:20px 25px 0}.tab{border:1px solid #e3e7f0;background:#fff;padding:10px 15px;border-radius:12px;cursor:pointer}.tab.on{background:#151a2d;color:#fff}.panel{padding:25px}.form{display:grid;gap:12px;max-width:430px}.form input{padding:13px;border:1px solid #dfe4ee;border-radius:12px;outline:none}.btn{border:0;padding:12px 16px;border-radius:12px;background:#5b5ce2;color:#fff;font-weight:700;cursor:pointer}.muted{color:#7c8497;font-size:12px}.msg{padding:11px;border-radius:11px;background:#fff2f3;color:#c13f52;font-size:12px;display:none}.app{display:none}.bar{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:#11162a;color:white}.nav{display:flex;gap:7px;flex-wrap:wrap;padding:18px 24px}.nav button{border:1px solid #e3e7ef;background:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.content{padding:0 24px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:18px;padding:17px}.card h3{margin:0 0 7px;font-size:15px}.pill{display:inline-block;background:#e9faf3;color:#18875d;padding:5px 8px;border-radius:99px;font-size:10px}.danger{background:#fff0f1;color:#bd3f4e}.adminbox{margin-top:18px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f5;text-align:right}.small{font-size:10px}.hide{display:none}@media(max-width:650px){.head h1{font-size:22px}.bar{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body>
<div id="auth" class="wrap"><div class="box">
<div class="head"><h1>Marwan Albasha</h1><p>منصة تعليمية متكاملة لإدارة الدراسة والمحاضرات والاختبارات والطلاب.</p></div>
<div class="tabs"><button class="tab on" onclick="authTab('login')">تسجيل الدخول</button><button class="tab" onclick="authTab('register')">حساب جديد</button></div>
<div class="panel">
<div id="login"><div class="form"><input id="lphone" placeholder="رقم الهاتف"><input id="lpass" type="password" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><div class="msg" id="lm"></div><div class="muted">حساب المدير التجريبي: 07700000000 / Admin@12345</div></div></div>
<div id="register" class="hide"><div class="form"><input id="rname" placeholder="الاسم الكامل"><input id="rphone" placeholder="رقم الهاتف"><input id="rpass" type="password" placeholder="كلمة المرور"><input id="rcode" placeholder="كود التفعيل مثل MBA-XXXX-XXXX-XXXX"><button class="btn" onclick="register()">إنشاء الحساب وتفعيل الكود</button><div class="msg" id="rm"></div></div></div>
</div></div></div>

<div id="app" class="app"><div style="width:100%">
<div class="bar"><div><b>Marwan Albasha</b><div class="small">لوحة المنصة</div></div><div class="row"><span id="who"></span><button class="navbtn" onclick="logout()">تسجيل الخروج</button></div></div>
<div class="nav"><button onclick="studentHome()">الرئيسية</button><button onclick="loadCourses()">المواد</button><button onclick="loadLectures()">المحاضرات</button><button onclick="loadExams()">الاختبارات</button><button id="adminBtn" class="hide" onclick="adminHome()">الإدارة</button></div>
<div class="content" id="content"></div></div></div>
<script>
let token=localStorage.getItem("mb_token"), user=JSON.parse(localStorage.getItem("mb_user")||"null");
const $=id=>document.getElementById(id);
function authTab(x){$("login").classList.toggle("hide",x!=="login");$("register").classList.toggle("hide",x!=="register");document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("on",(i===0)===(x==="login")))}
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body&&typeof opt.body!=="string"){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
async function login(){try{const d=await api("/api/auth/login",{method:"POST",body:{phone:$("lphone").value,password:$("lpass").value}});setSession(d);studentHome()}catch(e){$("lm").textContent=e.message;$("lm").style.display="block"}}
async function register(){try{const d=await api("/api/auth/register",{method:"POST",body:{name:$("rname").value,phone:$("rphone").value,password:$("rpass").value,activationCode:$("rcode").value}});setSession(d);studentHome()}catch(e){$("rm").textContent=e.message;$("rm").style.display="block"}}
function setSession(d){token=d.token;user=d.user;localStorage.setItem("mb_token",token);localStorage.setItem("mb_user",JSON.stringify(user));$("auth").style.display="none";$("app").style.display="block";$("who").textContent=user.name;if(user.role==="admin")$("adminBtn").classList.remove("hide")}
function logout(){localStorage.clear();location.reload()}
async function studentHome(){try{const d=await api("/api/dashboard");$("content").innerHTML=`<div class="card"><h2>مرحباً ${user.name}</h2><p class="muted">هذه لوحة الطالب الخاصة بك.</p></div><h3>المواد</h3><div class="grid">${d.courses.map(c=>`<div class="card"><h3>${c.title}</h3><p class="muted">${c.description}</p><span class="pill">التقدم ${c.progress}%</span></div>`).join("")}</div><h3>آخر الإشعارات</h3>${d.notifications.map(n=>`<div class="card"><b>${n.title}</b><p class="muted">${n.body}</p></div>`).join("")||'<p class="muted">لا توجد إشعارات.</p>'}`}catch(e){$("content").innerHTML=`<div class="msg" style="display:block">${e.message}</div>`}}
async function loadCourses(){const d=await api("/api/dashboard");$("content").innerHTML=`<h2>المواد الدراسية</h2><div class="grid">${d.courses.map(c=>`<div class="card"><h3>${c.title}</h3><p class="muted">${c.description}</p><p>التقدم: ${c.progress}%</p><button class="btn" onclick="enroll(${c.id})">تفعيل المادة</button></div>`).join("")}</div>`}
async function enroll(id){await api("/api/enroll/"+id,{method:"POST"});alert("تم تفعيل المادة")}
async function loadLectures(){const d=await api("/api/dashboard");$("content").innerHTML=`<h2>المحاضرات</h2><div class="grid">${d.lectures.map(x=>`<div class="card"><h3>${x.title}</h3><p class="muted">${x.course} • ${x.duration}</p><button class="btn" onclick="alert('يمكن ربط رابط الفيديو الحقيقي من لوحة الإدارة')">مشاهدة</button></div>`).join("")}</div>`}
async function loadExams(){const d=await api("/api/dashboard");$("content").innerHTML=`<h2>الاختبارات</h2><div class="grid">${d.exams.map(x=>`<div class="card"><h3>${x.title}</h3><p class="muted">${x.course} • ${x.questions} سؤال • ${x.duration} دقيقة</p><button class="btn" onclick="submitDemo(${x.id})">فتح الاختبار</button></div>`).join("")}</div>`}
async function submitDemo(id){const score=prompt("أدخل نتيجة الاختبار التجريبية من 0 إلى 100");if(score!==null){await api("/api/results",{method:"POST",body:{examId:id,score:Number(score)}});alert("تم حفظ النتيجة")}}
async function adminHome(){const s=await api("/api/admin/stats");$("content").innerHTML=`<h2>لوحة الإدارة</h2><div class="grid"><div class="card"><h3>${s.students}</h3><p class="muted">الطلاب</p></div><div class="card"><h3>${s.codes}</h3><p class="muted">كل الأكواد</p></div><div class="card"><h3>${s.unusedCodes}</h3><p class="muted">أكواد غير مستخدمة</p></div><div class="card"><h3>${s.courses}</h3><p class="muted">المواد</p></div></div><div class="adminbox card"><h3>إنشاء أكواد تفعيل</h3><div class="row"><input id="codeCount" type="number" min="1" max="1000" value="10" style="padding:10px"><button class="btn" onclick="makeCodes()">إنشاء</button></div><pre id="codesOut" style="white-space:pre-wrap"></pre></div><div class="adminbox card"><h3>الطلاب</h3><div id="students"></div></div>`;loadStudents()}
async function makeCodes(){const n=Number($("codeCount").value);const d=await api("/api/admin/codes",{method:"POST",body:{count:n}});$("codesOut").textContent=d.codes.join("\\n");}
async function loadStudents(){const a=await api("/api/admin/students");$("students").innerHTML=`<table class="table"><tr><th>الاسم</th><th>الهاتف</th><th>المرحلة</th><th>الحالة</th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.grade}</td><td><span class="pill ${x.active?'':'danger'}">${x.active?'فعال':'موقوف'}</span></td></tr>`).join("")}</table>`}
if(token&&user){$("auth").style.display="none";$("app").style.display="block";$("who").textContent=user.name;if(user.role==="admin")$("adminBtn").classList.remove("hide");studentHome()}
</script></body></html>
